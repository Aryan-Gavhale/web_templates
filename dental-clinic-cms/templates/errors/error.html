<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ code }} &middot; {{ title }}</title>
<style>
body { margin:0; min-height:100vh; display:grid; place-items:center; background:#F5F7F6; color:#12211F;
       font-family:-apple-system, 'Segoe UI', sans-serif; padding:32px; }
.box { max-width:540px; text-align:center; }
.code { font-size:88px; line-height:1; font-weight:300; color:#0F766E; opacity:.28; }
h1 { font-size:26px; margin:10px 0 12px; font-weight:600; }
p { color:#5C6B69; line-height:1.6; margin:0 0 26px; }
a { display:inline-block; background:#0F766E; color:#fff; text-decoration:none; margin:0 6px;
    padding:12px 22px; border-radius:999px; font-weight:600; font-size:15px; }
a.alt { background:transparent; color:#12211F; border:1px solid rgba(18,33,31,.16); }
</style>
</head>
<body>
<div class="box">
  <div class="code">{{ code }}</div>
  <h1>{{ title }}</h1>
  {% if message %}<p>{{ message }}</p>{% endif %}
  <a href="javascript:history.back()">Go back</a>
  <a class="alt" href="/admin">Admin panel</a>
</div>
</body>
</html>
